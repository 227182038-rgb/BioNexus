[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "biokit"
version = "2.0.0"
description = "BioKit 2.0 — a market-competitive Python toolkit for biological sequence analysis, genomics, structural bioinformatics, population genetics, CRISPR design, phylogenetics, and ML for biology."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "BioKit Contributors" },
]
keywords = [
    "bioinformatics",
    "genomics",
    "proteomics",
    "sequence-analysis",
    "blast",
    "assembly",
    "annotation",
    "primer-design",
    "crispr",
    "phylogenetics",
    "structural-biology",
    "population-genetics",
    "machine-learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "biopython>=1.83",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.1",
]
viz = [
    "reportlab>=4.0",
    "seaborn>=0.13",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mike>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = ["biokit[ml,viz,docs,dev]"]

[project.scripts]
biokit = "biokit.cli:app"

[project.urls]
Homepage = "https://github.com/227182038-rgb/Python-for-Biology"
Documentation = "https://227182038-rgb.github.io/Python-for-Biology/"
Repository = "https://github.com/227182038-rgb/Python-for-Biology"
Issues = "https://github.com/227182038-rgb/Python-for-Biology/issues"
Changelog = "https://github.com/227182038-rgb/Python-for-Biology/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["biokit"]

# ---------------------------------------------------------------------------
# Ruff — modern Python linter and formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["biokit", "tests"]
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # Pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "C4",           # flake8-comprehensions
    "UP",           # pyupgrade
    "RUF",          # ruff-specific
    "SIM",          # flake8-simplify
    "S",            # flake8-bandit
    "PERF",         # Perflint
]
ignore = [
    "E501",         # line length (handled by formatter)
    "PLR0913",      # too many arguments
    "S101",         # use of assert (needed for tests)
    "B008",         # function call in defaults (Typer pattern)
    "RUF022",       # __all__ sorting (we group by domain, not alphabetical)
    "RUF012",       # mutable class-level defaults (used by dataclass patterns)
    "PLR2004",      # magic values in tests
    "S314",         # XML parsing (we use ElementTree on local trusted files)
    "S108",         # /tmp usage in tests
    "E741",         # ambiguous variable name `l` (used in fortran-style loops)
    "B007",         # loop variable not used (often intentional)
    "RUF002",       # ambiguous unicode (we intentionally use en-dash for ranges)
    "RUF003",       # ambiguous unicode in comments
    "RUF059",       # unused unpacked variable (SVD return value)
    "SIM108",       # ternary operator (if/else is clearer for ML scoring)
    "SIM102",       # nested if (intentional for readability)
    "SIM117",       # nested with (intentional)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S301", "PLR2004", "E402", "F841", "S311"]
"tests/benchmarks/**" = ["S311"]  # deterministic RNG for fixtures, not crypto
"examples/**" = ["T201", "E402"]
"biokit/**/__init__.py" = ["F401"]
"biokit/sequence/dna.py" = ["F821"]    # forward references to RNA/Protein resolved at runtime
"biokit/sequence/rna.py" = ["F821"]    # forward references to DNA resolved at runtime
"biokit/machine_learning/**" = ["E402"]
"biokit/cli.py" = ["E402", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "Bio.*",
    "Bio.PDB.*",
    "Bio.SearchIO.*",
    "Bio.Graphics.GenomeDiagram.*",
    "reportlab.*",
    "seaborn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "biokit.machine_learning.*"
disallow_untyped_defs = false  # ML module mirrors sklearn patterns

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Pytest — test configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=biokit",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
    # Disable pytest-benchmark by default so the full suite runs fast and
    # contributes to coverage. To actually measure timings, run:
    #   pytest tests/benchmarks/ --benchmark-only
    "--benchmark-disable",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "property: marks tests as property-based tests",
    "benchmark: marks tests as benchmarks",
]
filterwarnings = [
    "ignore::DeprecationWarning:Bio.*",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["biokit"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/docs/*",
    "*/__init__.py",
    "biokit/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]
fail_under = 80

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bionexus-platform"
version = "1.0.0"
description = "BioNexus — a unified platform pairing BioKit 2.0 (deterministic bioinformatics) with NEXUS (AI-native biological interpretation intelligence). BioKit computes. Nexus understands."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "BioNexus Contributors" },
]
keywords = [
    "bioinformatics",
    "genomics",
    "proteomics",
    "sequence-analysis",
    "blast",
    "assembly",
    "annotation",
    "primer-design",
    "crispr",
    "phylogenetics",
    "structural-biology",
    "population-genetics",
    "machine-learning",
    "llm",
    "rag",
    "multi-agent",
    "scientific-computing",
    "ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    # BioKit 2.0 deps
    "biopython>=1.83",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    # NEXUS deps
    "pydantic>=2.5,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "structlog>=24.1,<25",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6.0,<7",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.1",
]
viz = [
    "reportlab>=4.0",
    "seaborn>=0.13",
]
# LLM providers (all four wired into the eval harness per Decision 3abcd)
openai = ["openai>=1.30,<2"]
anthropic = ["anthropic>=0.25,<1"]
gemini = ["google-generativeai>=0.7,<1"]
glm = ["zhipuai>=2.0,<3"]
ollama = ["ollama>=0.2,<1"]
local-embeddings = ["sentence-transformers>=3.0,<4"]
web = ["jinja2>=3.1,<4", "python-multipart>=0.0.9,<1"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.25,<1",
    "mike>=2.0,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "pytest-asyncio>=0.23,<1",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = ["bionexus-platform[ml,viz,openai,anthropic,gemini,glm,ollama,local-embeddings,web,docs,dev]"]

[project.scripts]
biokit = "biokit.cli:app"
nexus = "nexus.cli.main:app"
bionexus = "bridge.cli:app"

[project.urls]
Homepage = "https://github.com/227182038-rgb/BioNexus"
Documentation = "https://227182038-rgb.github.io/BioNexus/"
Repository = "https://github.com/227182038-rgb/BioNexus"
Issues = "https://github.com/227182038-rgb/BioNexus/issues"
Changelog = "https://github.com/227182038-rgb/BioNexus/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["biokit", "nexus", "bridge"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["biokit", "nexus", "bridge", "tests"]
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM", "S", "PERF"]
ignore = [
    "E501",
    "PLR0913",
    "S101",
    "B008",
    "RUF022",
    "RUF012",
    "PLR2004",
    "S314",
    "S108",
    "E741",
    "B007",
    "RUF002",
    "RUF003",
    "RUF059",
    "SIM108",
    "SIM102",
    "SIM117",
    "B904",
    "PERF203",  # try-except in loop (NEXUS pattern, kept for clarity)
    "PERF401",  # list.extend vs append (NEXUS pattern, kept for readability)
    "S112",     # try-except-continue (NEXUS pattern, kept for resilience)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S301", "PLR2004", "E402", "F841", "S311", "B011"]
"tests/benchmarks/**" = ["S311"]
"examples/**" = ["T201", "E402"]
"biokit/**/__init__.py" = ["F401"]
"nexus/**/__init__.py" = ["F401"]
"bridge/**/__init__.py" = ["F401"]
"biokit/sequence/dna.py" = ["F821"]
"biokit/sequence/rna.py" = ["F821"]
"biokit/machine_learning/**" = ["E402"]
"biokit/cli.py" = ["E402"]
"nexus/web/**" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=biokit",
    "--cov=nexus",
    "--cov=bridge",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=65",
    "--benchmark-disable",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "property: marks tests as property-based tests",
    "benchmark: marks tests as benchmarks",
    "network: marks tests requiring network/LLM access",
    "eval: marks tests in the eval harness",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:matplotlib.*",
    "ignore:.*PyparsingDeprecationWarning.*",
]

[tool.coverage.run]
source = ["biokit", "nexus", "bridge"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/docs/*",
    "*/__init__.py",
    "biokit/cli.py",
    "nexus/web/templates/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]
fail_under = 65

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "Bio.*",
    "Bio.PDB.*",
    "Bio.SearchIO.*",
    "Bio.Graphics.GenomeDiagram.*",
    "numpy",
    "numpy.*",
    "numpy.typing",
    "numpy.typing.*",
    "matplotlib",
    "matplotlib.*",
    "matplotlib.pyplot",
    "matplotlib.pyplot.*",
    "matplotlib.axes",
    "matplotlib.axes.*",
    "matplotlib.figure",
    "matplotlib.figure.*",
    "typer",
    "typer.*",
    "rich",
    "rich.*",
    "rich.console",
    "rich.console.*",
    "rich.table",
    "rich.table.*",
    "reportlab.*",
    "seaborn.*",
    "openai.*",
    "anthropic.*",
    "google.*",
    "google.generativeai.*",
    "zhipuai.*",
    "ollama.*",
    "jinja2.*",
    "structlog.*",
    "scipy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "biokit.machine_learning.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# BioPython ships py.typed but its inline annotations are incomplete on some
# installations (SeqIO.parse, PDBParser, PPBuilder, SeqFeature lack return
# type annotations). On installations where BioPython IS fully typed, this
# override is a no-op. On installations where it is not, it prevents
# false-positive no-untyped-call and no-any-return errors.
module = [
    "biokit.structural.loader",
    "biokit.structural.secondary",
    "biokit.annotation.feature",
    "biokit.io.genbank",
    "biokit.utils.io_utils",
]
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
